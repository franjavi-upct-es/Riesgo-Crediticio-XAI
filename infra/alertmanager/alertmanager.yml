# infra/alertmanager/alertmanager.yml
#
# AlertManager configuration for routing alerts by severity.
# Replace webhook URLs with your actual Slack/PagerDuty endpoints.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts → batched notification
    - match:
        severity: warning
      receiver: warning
      group_wait: 1m
      repeat_interval: 4h

receivers:
  - name: default
    # Catch-all — configure your preferred channel
    webhook_configs:
      - url: "http://localhost:9095/webhook"  # Placeholder
        send_resolved: true

  - name: critical
    # Replace with PagerDuty, Opsgenie, or Slack webhook
    webhook_configs:
      - url: "http://localhost:9095/webhook/critical"  # Placeholder
        send_resolved: true
    # Example PagerDuty:
    # pagerduty_configs:
    #   - service_key: "<your-pagerduty-integration-key>"

  - name: warning
    # Replace with Slack webhook
    webhook_configs:
      - url: "http://localhost:9095/webhook/warning"  # Placeholder
        send_resolved: true
    # Example Slack:
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/T.../B.../..."
    #     channel: "#credit-risk-alerts"
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'

# Silence repeated alerts from the same source
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
