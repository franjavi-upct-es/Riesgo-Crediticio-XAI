# .github/workflows/cd.yml
#
# Continuous Delivery — triggered on version tags (v*).
# Steps: build → push images to GHCR → (optional) deploy to K8s.

name: CD

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}/api
  DASHBOARD_IMAGE: ${{ github.repository }}/dashboard

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build and push Docker images to GitHub Container Registry
  # ---------------------------------------------------------------------------
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: api
            dockerfile: Dockerfile.api
          - image_name: dashboard
            dockerfile: Dockerfile.dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Kubernetes (optional — requires K8s secrets configured)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: vars.K8S_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image tags in manifests
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          sed -i "s|IMAGE_TAG|${TAG}|g" infra/k8s/*.yml

      - name: Apply manifests
        run: |
          kubectl apply -f infra/k8s/namespace.yml
          kubectl apply -f infra/k8s/configmap.yml
          kubectl apply -f infra/k8s/secret.yml
          kubectl apply -f infra/k8s/deployment.yml
          kubectl apply -f infra/k8s/service.yml
          kubectl apply -f infra/k8s/ingress.yml
          kubectl apply -f infra/k8s/hpa.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/credit-risk-api -n credit-risk --timeout=300s
