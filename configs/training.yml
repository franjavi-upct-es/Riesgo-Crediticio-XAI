# configs/training.yml
#
# Training hyperparameters and pipeline configuration.
# Values here can be overridden by environment variables (TRAIN_ prefix).
# This file is the canonical reference for experiment reproducibility.

data:
  uci_dataset_id: 144
  test_size: 0.2
  random_state: 42

validation:
  size: 0.15
  early_stopping_rounds: 30

tuning:
  cv_folds: 5

threshold:
  metric: "f1"

model:
  objective: "binary:logistic"
  eval_metric: "logloss"
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0

smote:
  sampling_strategy: "minority"
  k_neighbors: 5
  max_samples: 50000  # Skip SMOTE for datasets larger than this (use scale_pos_weight instead)

performance:
  tuning_max_samples: 30000  # Stratified subsample for Optuna tuning
  shap_max_samples: 5000     # Subsample for SHAP explanations
  n_jobs: 2                  # XGBoost threads (avoid -1 which copies data per core)

mlflow:
  experiment_name: "credit-risk-xai"
  run_name_prefix: "xgb"
  tags:
    project: "credit-risk-xai"
    model_type: "xgboost"
    dataset: "german-credit-uci-144"
