# configs/datasets/taiwan_credit.yml
#
# Schema definition for the Taiwan Credit Card Default dataset (UCI ID 350).
# 30K clients, 24 features, binary classification: default payment next month.

id: taiwan_credit
name: Taiwan Credit Card Default
description: >
  Credit card default payment data from Taiwan (2005). 30,000 clients
  with 24 features including payment history, bill amounts, and demographics.
  Binary target: default payment next month (yes/no).
source:
  type: uci
  uci_dataset_id: 350
  column_mapping:
    X1: limit_bal
    X2: sex
    X3: education
    X4: marriage
    X5: age
    X6: pay_sept
    X7: pay_aug
    X8: pay_jul
    X9: pay_jun
    X10: pay_may
    X11: pay_apr
    X12: bill_amt_sept
    X13: bill_amt_aug
    X14: bill_amt_jul
    X15: bill_amt_jun
    X16: bill_amt_may
    X17: bill_amt_apr
    X18: pay_amt_sept
    X19: pay_amt_aug
    X20: pay_amt_jul
    X21: pay_amt_jun
    X22: pay_amt_may
    X23: pay_amt_apr

target:
  column: default_payment
  mapping:
    0: 0
    1: 1
  positive_label: 1
  labels:
    0: "No Default"
    1: "Default"

features:
  - name: limit_bal
    type: numerical
    description: Credit limit (NT dollar)
    min: 10000
    max: 1000000

  - name: sex
    type: categorical
    description: Gender (1=male, 2=female)
    options: ["1", "2"]
    protected: true

  - name: education
    type: categorical
    description: Education level (1=grad school, 2=university, 3=high school, 4=others)
    options: ["1", "2", "3", "4", "5", "6"]

  - name: marriage
    type: categorical
    description: Marital status (1=married, 2=single, 3=others)
    options: ["0", "1", "2", "3"]

  - name: age
    type: numerical
    description: Age in years
    min: 18
    max: 100
    protected: true

  - name: pay_sept
    type: numerical
    description: Repayment status in September (-1=pay duly, 1-9=months delayed)
    min: -2
    max: 9

  - name: pay_aug
    type: numerical
    description: Repayment status in August
    min: -2
    max: 9

  - name: pay_jul
    type: numerical
    description: Repayment status in July
    min: -2
    max: 9

  - name: pay_jun
    type: numerical
    description: Repayment status in June
    min: -2
    max: 9

  - name: pay_may
    type: numerical
    description: Repayment status in May
    min: -2
    max: 9

  - name: pay_apr
    type: numerical
    description: Repayment status in April
    min: -2
    max: 9

  - name: bill_amt_sept
    type: numerical
    description: Bill statement amount in September (NT dollar)
    min: -200000
    max: 1000000

  - name: bill_amt_aug
    type: numerical
    description: Bill statement amount in August
    min: -200000
    max: 1000000

  - name: bill_amt_jul
    type: numerical
    description: Bill statement amount in July
    min: -200000
    max: 1000000

  - name: bill_amt_jun
    type: numerical
    description: Bill statement amount in June
    min: -200000
    max: 1000000

  - name: bill_amt_may
    type: numerical
    description: Bill statement amount in May
    min: -200000
    max: 1000000

  - name: bill_amt_apr
    type: numerical
    description: Bill statement amount in April
    min: -200000
    max: 1000000

  - name: pay_amt_sept
    type: numerical
    description: Previous payment amount in September (NT dollar)
    min: 0
    max: 1000000

  - name: pay_amt_aug
    type: numerical
    description: Previous payment amount in August
    min: 0
    max: 1000000

  - name: pay_amt_jul
    type: numerical
    description: Previous payment amount in July
    min: 0
    max: 1000000

  - name: pay_amt_jun
    type: numerical
    description: Previous payment amount in June
    min: 0
    max: 1000000

  - name: pay_amt_may
    type: numerical
    description: Previous payment amount in May
    min: 0
    max: 1000000

  - name: pay_amt_apr
    type: numerical
    description: Previous payment amount in April
    min: 0
    max: 1000000
