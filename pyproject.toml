[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-xai"
version = "3.0.0"
description = "Production-grade credit risk classification with SHAP explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "numpy>=1.26.0,<2.0.0",
  "xgboost>=2.0.0,<3.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
  "imbalanced-learn>=0.12.0,<1.0.0",
  "joblib>=1.4.0,<2.0.0",
  "shap>=0.45.0,<1.0.0",
  "ucimlrepo>=0.0.7",
  "structlog>=24.1.0,<25.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "slowapi>=0.1.9,<1.0.0",
  "mlflow>=2.14.0,<3.0.0",
  "pyyaml>=6.0,<7.0",
  "scipy>=1.13.0,<2.0.0",
  "opentelemetry-api>=1.25.0,<2.0.0",
  "opentelemetry-sdk>=1.25.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<2.0.0",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.36.0,<2.0.0",
  "plotly>=5.22.0,<6.0.0",
  "matplotlib>=3.9.0,<4.0.0",
  "requests>=2.32.0,<3.0.0",
]
monitoring = ["grafana-api>=1.0.3,<2.0.0"]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.5.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
  "pre-commit>=3.7.0,<4.0.0",
]
all = ["credit-risk-xai[dashboard,monitoring,dev]"]

[project.scripts]
credit-risk-train = "src.model.train:main"
credit-risk-api = "src.api.app:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
  "unit: Unit tests (fast, no external dependencies)",
  "integration: Integration tests (may require model artifacts)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501", # Line too long (handled by formatter)
  "N803", # Argument name should be lowercase (ML convention: X, y)
  "N806", # Variable should be lowercase (ML convention: X_train, X_test)
  "B008", # Function call in default argument (FastAPI Depends pattern)
  "B905", # zip without strict (ML iteration patterns)
  "B017", # pytest.raises(Exception) is fine in tests
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
